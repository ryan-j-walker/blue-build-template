---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-gnome-nvidia-open
# description will be included in the image's metadata
description: This is my personal Bazzite Gnome Nvidia Open image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia-open
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: dnf
    remove:
      packages:
        - fedora-bookmarks
        - fedora-chromium-config
        - fedora-chromium-config-gnome
        - gnome-shell-extension-gsconnect
        - rom-properties
        - waydroid
    install:
      packages:
        - adobe-source-serif-pro-fonts
        - containerd
        - firefox
        - podman-compose
        - podman-machine
        - podman-tui
        - solaar
        - https://proton.me/download/mail/linux/ProtonMail-desktop-beta.rpm
        - https://proton.me/download/pass/linux/ProtonPass.rpm

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        remove:
          - org.mozilla.firefox

  - type: script
    snippets:
      - "rm -f /etc/uupd/config.json"
      - "rm -rf /usr/share/applications/Waydroid/"
      - "rm -f /usr/share/applications/waydroid-container-restart.desktop"
    scripts:
      - gnome/theming.sh

  - type: gnome-extensions
    install:
      - adw-gtk3 Colorizer
      - Alphabetical App Grid
      - Auto Accent Colour
      - 1262 # Bing Wallpaper
      - Coverflow Alt-Tab
      - Dash to Panel
      - Just Perfection
      - OSD Volume Number
      - Quick Settings Audio Panel
      - Weather or Not
    uninstall:
      - Add to Steam
      - Burn My Windows
      - Caffeine
      - Compiz alike magic lamp effect
      - Compiz windows effect
      - Desktop Cube
      - Logo Menu
      - Restart To

  - type: systemd
    user:
      enabled:
        - podman.socket

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
