---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: cosmic-atomic
# description will be included in the image's metadata
description: This is my personal Fedora Cosmic Atomic image.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/repository/fedora-ostree-desktops/cosmic-atomic
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # - type: files
  #   files:
  #     - source: system/silverblue
  #       destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
  
  - type: dnf
    repos:
      cleanup: false
      nonfree: rpmfusion
    replace:
      - from-repo: rpmfusion-free
        allow-erasing: true
        packages:
          - old: ffmpeg-free
            new: ffmpeg

  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
      nonfree: rpmfusion
    remove:
      packages:
        - fedora-third-party
        - firefox
        - firefox-langpacks
    group-install:
      with-optional: false
      install-weak-deps: false
      exclude:
        - PackageKit-gstreamer-plugin
      packages:
        - multimedia
    install:
      packages:
        - autofs
        - bcache-tools
        - containerd
        - distrobox
        - fuse
        - fuse-encfs
        - fuse-libs
        - lm_sensors
        - lshw
        - mesa-va-drivers-freeworld
        - openssh-askpass
        - podman-compose
        - podman-machine
        - podman-tui
        - powerstat
        - powertop
        - rclone
        - solaar
        - solaar-udev
        - uupd

  # - type: default-flatpaks
  #   configurations:
  #     - notify: false
  #       scope: system
  #       repo:
  #         title: Flathub (system)

  - type: brew
    direct-pull: true
    nofile-limits: true
    brew-analytics: false

  # - type: script
  #   scripts:
  #       - silverblue/theming.sh
  #       - silverblue/cleanup.sh

  - type: systemd
    system:
      disable:
        - rpm-ostreed-automatic.timer
      enabled:
        - uupd.timer
    user:
      enabled:
        - podman.socket

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
